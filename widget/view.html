<div class="widget-container chart">
  <div class="display-flex-space-between margin-chart">
      <div class="padding-right-0 padding-left-0 widget-dashboard-title-width"
          data-ng-class="(page === 'dashboard' || page === 'reporting') ? 'widget-dashboard-title-width' : 'widget-title-width'">
          <h5 class="margin-top-0 margin-bottom-0 text-overflow ng-binding">{{config.title}}</h5>
      </div>
  </div>
  <div>
    <div data-ng-if="config.embedded===undefined" class="widget-container chart display-flex align-items-center justify-content" style="width: 100%; height:100%" id="world-map-{{config.wid}}">
    </div>
    <div data-ng-if="config.data.length===0" class="text-center font-08em">{{viewWidgetVars.ERROR_NO_INFORMATION_AVAILABLE}}</div>
    <div data-ng-if="config.embedded" class="widget-container chart display-flex align-items-center justify-content" style="width: 100%; height:100%" id="world-map-embedded">
    </div>
  </div>
</div>
